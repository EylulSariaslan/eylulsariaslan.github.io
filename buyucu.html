<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Eylül Sarıaslan - Endüstriyel Tasarım Mühendisi. 3D Modelleme, mekanik tasarım ve inovatif projeler üzerine profesyonel portfolyo.">
    <meta name="keywords" content="Eylül Sarıaslan, Industrial Design, Endüstriyel Tasarım, 3D Modeling, Portfolyo">
    <title>Büyücü Serüveni</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #1a1a1d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            /* Mobilde çift tıklamada seçmeyi engeller */
            user-select: none; 
            -webkit-user-select: none;
        }

        canvas {
            box-shadow: 0 0 30px rgba(201, 122, 255, 0.2);
            border-bottom: 5px solid #c97aff;
            /* ÇÖZÜM: Canvas'ın oyun oranını bozmadan küçük ekranlara sığmasını sağlar */
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            /* Mobilde parmak kaydırmalarıyla sayfanın hareket etmesini engeller */
            touch-action: none; 
        }

        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(20, 15, 30, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #c97aff;
            display: none;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            /* Mobilde oyun sonu ekranının ekrandan taşmaması için */
            width: 80%;
            max-width: 400px;
        }

        h1 { color: #d8a8ff; margin-bottom: 10px; font-size: 36px; text-transform: uppercase; letter-spacing: 2px;}
        p { font-size: 20px; margin-bottom: 25px; color: #aaa;}
        #finalScore { color: #fff; font-size: 28px; font-weight: 900;}

        button {
            background-color: #c97aff;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            width: 100%; /* Mobilde butona rahat basılması için genişletildi */
        }

        button:hover {
            background-color: #e0b0ff;
            transform: scale(1.05);
        }
        
        /* Ekstra küçük ekranlar için yazı boyutları */
        @media (max-width: 480px) {
            h1 { font-size: 28px; }
            p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="gameOverScreen">
        <h1>Büyü Bozuldu!</h1>
        <p>Skorun: <span id="finalScore">0</span></p>
        <button id="btnYeniden" onclick="oyunuSifirla()" tabindex="-1">Yeniden Dene</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScore = document.getElementById("finalScore");

    const buyucuGorseli = new Image();
    buyucuGorseli.src = "buyucu.png";
    
    const arkaplanGorseli = new Image();
    arkaplanGorseli.src = "arkaplan.png";
    
    const maviYaratikGorseli = new Image(); maviYaratikGorseli.src = "mavi_yaratik.png";
    const turuncuYaratikGorseli = new Image(); turuncuYaratikGorseli.src = "turuncu_yaratik.png";
    const yesilYaratikGorseli = new Image(); yesilYaratikGorseli.src = "yesil_yaratik.png";

    const YERCEKIMI = 0.6;
    const ZIPLAMA_GUCU = -16; 
    const ZEMIN = canvas.height;

    const BASLANGIC_HIZI = 4; 
    let engelHizi = BASLANGIC_HIZI; 

    let buyucu = { x: 100, y: 0, w: 40, h: 60, hizY: 0, yerdeMi: true };
    
    let engeller = [];
    let skor = 0;
    let oyunAktif = true;
    let sonEngelZamani = 0; 

    function zipla() {
        if (oyunAktif && buyucu.yerdeMi) {
            buyucu.hizY = ZIPLAMA_GUCU;
            buyucu.yerdeMi = false;
        }
    }

    // Masaüstü için Fare Tıklaması
    document.addEventListener("mousedown", (e) => {
        if (e.button === 0 && e.target.tagName !== "BUTTON") {
            window.focus(); 
            zipla();
        }
    });

    // Mobil için Ekrana Dokunma (Touchstart)
    document.addEventListener("touchstart", (e) => {
        if (e.target.tagName !== "BUTTON") {
            e.preventDefault(); // Ekranda çift tıklama ile zoom yapılmasını veya kaydırılmasını önler
            window.focus();
            zipla();
        }
    }, { passive: false });

    // Masaüstü için Klavye Kontrolü
    document.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.key === " " || e.code === "Enter") {
            e.preventDefault(); 
            if (!e.repeat) {
                zipla(); 
            }
        }
    });

    function oyunuSifirla() {
        buyucu.y = ZEMIN - buyucu.h;
        buyucu.hizY = 0;
        buyucu.yerdeMi = true;
        
        engeller = [];
        skor = 0;
        oyunAktif = true;
        
        engelHizi = BASLANGIC_HIZI; 
        sonEngelZamani = Date.now() - 2000; 
        
        gameOverScreen.style.display = "none";
        document.getElementById("btnYeniden").blur(); 
        
        window.focus(); 
        
        requestAnimationFrame(oyunDongusu);
    }

    function oyunBitir() {
        oyunAktif = false;
        finalScore.innerText = Math.floor(skor);
        gameOverScreen.style.display = "block";
    }

    function oyunDongusu() {
        if (!oyunAktif) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(arkaplanGorseli, 0, 0, canvas.width, canvas.height);

        buyucu.hizY += YERCEKIMI;
        buyucu.y += buyucu.hizY;

        if (buyucu.y + buyucu.h >= ZEMIN) {
            buyucu.y = ZEMIN - buyucu.h;
            buyucu.hizY = 0;
            buyucu.yerdeMi = true;
        }

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#c97aff";
        ctx.drawImage(buyucuGorseli, buyucu.x, buyucu.y, buyucu.w, buyucu.h);
        ctx.shadowBlur = 0; 

        let simdi = Date.now();
        let gecenZaman = simdi - sonEngelZamani;
        
        let daralmaKatsayisi = (skor / 100) * 65; 
        let minBoşluk = Math.max(230, 320 - daralmaKatsayisi);
        let maxBoşluk = Math.max(280, 450 - daralmaKatsayisi);
        let hedefPikselMesafesi = Math.random() * (maxBoşluk - minBoşluk) + minBoşluk;
        let beklemeSuresi = (hedefPikselMesafesi * 16.666) / engelHizi;

        if (gecenZaman > beklemeSuresi) {
            let isLarge = Math.random() > 0.5; 
            let boy = isLarge ? (Math.random() * 40 + 70) : (Math.random() * 20 + 30);
            let secilenGorsel;
            let secilenRenk;

            if (isLarge) {
                if (Math.random() > 0.5) {
                    secilenGorsel = maviYaratikGorseli;
                    secilenRenk = "#00ffff"; // Mavi
                } else {
                    secilenGorsel = turuncuYaratikGorseli;
                    secilenRenk = "#ff9900"; // Turuncu
                }
            } else {
                secilenGorsel = yesilYaratikGorseli;
                secilenRenk = "#00ff00"; // Yeşil
            }

            engeller.push({ x: canvas.width, y: ZEMIN - boy, w: 60, h: boy, img: secilenGorsel, color: secilenRenk });
            sonEngelZamani = simdi;
        }

        for (let i = 0; i < engeller.length; i++) {
            let e = engeller[i];
            e.x -= engelHizi; 

            ctx.shadowBlur = 20; 
            ctx.shadowColor = e.color;
            ctx.drawImage(e.img, e.x, e.y, e.w, e.h);
            ctx.shadowBlur = 0; 

            if (
                buyucu.x < e.x + e.w &&
                buyucu.x + buyucu.w > e.x &&
                buyucu.y < e.y + e.h &&
                buyucu.y + buyucu.h > e.y
            ) {
                oyunBitir();
            }

            if (e.x + e.w < 0) {
                engeller.splice(i, 1);
                i--;
                skor += 10;
                
                if (engelHizi < 10) {
                    engelHizi += 0.15; 
                }
            }
        }

        ctx.fillStyle = "white";
        ctx.font = "bold 24px Montserrat";
        ctx.fillText("Skor: " + skor, 20, 40);

        requestAnimationFrame(oyunDongusu);
    }

    window.onload = () => {
        window.focus();
        oyunuSifirla();
    };

</script>
</body>
</html>
