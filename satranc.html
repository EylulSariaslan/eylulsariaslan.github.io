<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mistik Satranç</title>
     <!--anahtar kelimeler-->
    <meta name="description" content="Eylül Sarıaslan - Endüstriyel Tasarım Mühendisi. 3D Modelleme, mekanik tasarım ve inovatif projeler üzerine profesyonel portfolyo.">
    <meta name="keywords" content="Eylül Sarıaslan, Industrial Design, Endüstriyel Tasarım, 3D Modeling, Portfolyo">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { background-color: #0c0818; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { max-width: 100vw; max-height: 90vh; object-fit: contain; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="chessCanvas" width="760" height="640"></canvas>

<script>
    const canvas = document.getElementById('chessCanvas');
    const ctx = canvas.getContext('2d');
    const game = new Chess(); 

    const BOARD_SIZE = 640;
    const PANEL_WIDTH = 120;
    const SQ_SIZE = 80;
    
    // Görseller
    const pieces = ['wP', 'wR', 'wN', 'wB', 'wQ', 'wK', 'bP', 'bR', 'bN', 'bB', 'bQ', 'bK'];
    const images = {};
    pieces.forEach(p => {
        images[p] = new Image();
        images[p].src = `${p}.png`;
    });

    function draw() {
        // Tahtayı çiz
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                let color = (r+c)%2 === 0 ? "#ebebd2" : "#779556";
                ctx.fillStyle = color;
                ctx.fillRect(c*SQ_SIZE, r*SQ_SIZE, SQ_SIZE, SQ_SIZE);
            }
        }

        // Taşları çiz
        const boardState = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardState[r][c];
                if (piece) {
                    const colorPrefix = piece.color === 'w' ? 'w' : 'b';
                    const pieceName = `${colorPrefix}${piece.type.toUpperCase()}`;
                    if (images[pieceName]) {
                        ctx.drawImage(images[pieceName], c * SQ_SIZE, r * SQ_SIZE, SQ_SIZE, SQ_SIZE);
                    }
                }
            }
        }

        // Sağ Panel
        ctx.fillStyle = "#141026";
        ctx.fillRect(BOARD_SIZE, 0, PANEL_WIDTH, 640);
        
        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("SIRA: " + (game.turn() === 'w' ? "SİZDE" : "BOTTA"), BOARD_SIZE + 20, 100);

        // 🔥 ŞAH UYARISI
        if (game.in_check()) {
            ctx.fillStyle = "#ff3c3c";
            ctx.font = "bold 20px Arial";
            ctx.fillText("ŞAH!", BOARD_SIZE + 20, 140);
        }

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("SKORLAR", BOARD_SIZE + 30, 180);
        ctx.fillText("Siz: 0", BOARD_SIZE + 20, 210);
        ctx.fillText("Bot: 0", BOARD_SIZE + 20, 235);
    }

    let selectedSquare = null;
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = 760 / rect.width;
        const scaleY = 640 / rect.height;
        const x = Math.floor(((e.clientX - rect.left) * scaleX) / SQ_SIZE);
        const y = Math.floor(((e.clientY - rect.top) * scaleY) / SQ_SIZE);
        
        if (x < 8) {
            const square = String.fromCharCode(97 + x) + (8 - y);
            if (selectedSquare) {
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    draw();
                    setTimeout(aiMove, 500);
                }
                selectedSquare = null;
            } else {
                selectedSquare = square;
            }
        }
    });

    function aiMove() {
        const moves = game.moves();
        if (moves.length > 0) {
            game.move(moves[Math.floor(Math.random() * moves.length)]);
            draw();
        }
    }

    Promise.all(Object.values(images).map(img => img.decode().catch(() => {}))).then(draw);
</script>
</body>
</html>
